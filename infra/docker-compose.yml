name: rag_system

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_system}
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-rag_redis_password}
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rag_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rag_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-rag-documents}
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  opensearch:
    build:
      context: ./opensearch
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "${OPENSEARCH_JAVA_OPTS:--Xms2g -Xmx2g}"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "${OPENSEARCH_PERFORMANCE_ANALYZER_PORT:-9600}:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
      # analysis-ik supports custom dictionaries under config/analysis-ik.
      # Reconfirm this path after the custom image is built if the plugin layout changes.
      - ./opensearch/ik/custom.dic:/usr/share/opensearch/config/analysis-ik/custom.dic:ro
      - ./opensearch/ik/stopword.dic:/usr/share/opensearch/config/analysis-ik/stopword.dic:ro
      - ./opensearch/ik/IKAnalyzer.cfg.xml:/usr/share/opensearch/config/analysis-ik/IKAnalyzer.cfg.xml:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
  opensearch_data:

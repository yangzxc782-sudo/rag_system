[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-system-backend"
version = "0.1.0"
description = "FastAPI backend skeleton for the casting process knowledge base RAG system."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.1,<4.0",
  "langgraph==1.2.12",
  "langgraph-checkpoint-postgres==3.1.2",
  "psycopg-pool==3.3.3",
  "pydantic-settings>=2.0,<3.0",
  "python-dotenv>=1.0,<2.0",
  "redis>=5.0,<7.0",
  "minio>=7.2,<8.0",
  "python-multipart>=0.0.9,<1.0",
  "markdown-it-py==4.2.0",
  "neo4j==6.2.0",
  "opensearch-py>=3.2,<4.0",
  "openai>=1.0,<3.0",
  "pgvector>=0.3,<1.0",
  "sentence-transformers>=2.7.0,<6.0",
  "transformers>=4.51.0,<5.0",
  "torch>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "httpx>=0.27,<1.0",
  "alembic>=1.13,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "phase13_integration: synthetic PostgreSQL tests gated by a fresh isolated Phase 13 instance",
  "integration: destructive Phase 10 tests gated by dedicated targets and rollout authorization",
  "phase10_knowledge_deferred: Deferred by project owner pending Knowledge Item Library refactor.",
]
